  <!-- Title block -->
  <rect x="490" y="140" width="280" height="18" fill="#171717"/>
  <rect x="490" y="176" width="520" height="8" fill="#d4d4d4"/>
  <rect x="490" y="196" width="460" height="8" fill="#d4d4d4"/>

  <!-- Paragraph -->
  <g fill="#e5e5e5">
