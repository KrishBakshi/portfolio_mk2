    <line x1="902" y1="380" x2="902" y2="548"/>
  </g>
  <rect x="478" y="368" width="644" height="192" fill="none" stroke="#171717" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Signature / stamp region -->
  <rect x="490" y="600" width="220" height="120" fill="none" stroke="#d4d4d4" stroke-width="1.25"/>
  <path d="M520 680 C560 640, 620 720, 680 660" fill="none" stroke="#171717" stroke-width="1.5"/>
  <rect x="478" y="588" width="244" height="144" fill="none" stroke="#171717" stroke-width="1.5"/>
